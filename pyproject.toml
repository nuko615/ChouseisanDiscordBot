[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chouseisan-discord-bot"
version = "0.1.0"
description = "Create Chouseisan events and notify Discord from one configurable Python bot."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nuko615" }]
dependencies = [
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "selenium>=4.27,<5",
  "tzdata>=2025.2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/nuko615/ChouseisanDiscordBot"

[project.scripts]
chouseisan-discord-bot = "chouseisan_discord_bot.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
